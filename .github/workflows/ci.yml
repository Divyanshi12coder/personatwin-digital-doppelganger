name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personatwin
          POSTGRES_PASSWORD: personatwin
          POSTGRES_DB: personatwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personatwin -d personatwin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL + pgvector)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://personatwin:personatwin@localhost:5432/personatwin_test
      - name: Migrations (upgrade, downgrade, upgrade, drift check)
        env:
          DATABASE_URL: postgresql+psycopg://personatwin:personatwin@localhost:5432/personatwin_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
