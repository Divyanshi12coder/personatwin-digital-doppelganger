<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6B4226"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#E6D9BF;stroke-width:1.5}
      .zone{fill:#F7F1E3;stroke:#E6D9BF;stroke-width:1.5}
      .dark{fill:#4A2C1A}
      .t{font-size:15px;font-weight:700;fill:#4A2C1A}
      .s{font-size:12.5px;fill:#806B5A}
      .w{font-size:15px;font-weight:700;fill:#FFF9ED}
      .ws{font-size:12.5px;fill:#F8E8B0}
      .z{font-family:Georgia,serif;font-size:18px;font-weight:700;fill:#6B4226}
      .l{stroke:#6B4226;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lab{font-size:11.5px;fill:#6B4226}
    </style>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#FFF9ED"/>
  <text x="40" y="46" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#4A2C1A">PersonaTwin — system architecture</text>

  <!-- browser -->
  <rect class="zone" x="40" y="80" width="300" height="500" rx="16"/>
  <text class="z" x="60" y="112">Browser (React SPA)</text>
  <rect class="box" x="60" y="132" width="260" height="70" rx="12"/>
  <text class="t" x="76" y="160">Pages &amp; components</text>
  <text class="s" x="76" y="182">Landing · Chat · Vault · Inspector · Insights</text>
  <rect class="box" x="60" y="218" width="260" height="70" rx="12"/>
  <text class="t" x="76" y="246">AuthContext + API client</text>
  <text class="s" x="76" y="268">JWT bearer · typed fetch · error states</text>
  <rect class="box" x="60" y="304" width="260" height="70" rx="12"/>
  <text class="t" x="76" y="332">Mini-markdown renderer</text>
  <text class="s" x="76" y="354">React elements only — no raw HTML</text>
  <rect x="60" y="398" width="260" height="160" rx="12" fill="#F8E8B0" stroke="#E7B84B"/>
  <text class="t" x="76" y="426">No AI keys here</text>
  <text class="s" x="76" y="450">The browser only calls /api/* on the</text>
  <text class="s" x="76" y="468">PersonaTwin backend. LLM and embedding</text>
  <text class="s" x="76" y="486">providers are reached server-side only.</text>
  <text class="s" x="76" y="514">Dev: Vite proxy · Docker: nginx proxy</text>
  <text class="s" x="76" y="532">Vercel: VITE_API_URL → Render</text>

  <!-- backend -->
  <rect class="zone" x="400" y="80" width="460" height="500" rx="16"/>
  <text class="z" x="420" y="112">FastAPI backend</text>
  <rect class="dark" x="420" y="132" width="420" height="58" rx="12"/>
  <text class="w" x="436" y="158">API routers + dependency injection</text>
  <text class="ws" x="436" y="178">auth · profile · knowledge · experiences · memories · chat · insights</text>
  <rect class="box" x="420" y="206" width="200" height="74" rx="12"/>
  <text class="t" x="436" y="234">Security</text>
  <text class="s" x="436" y="254">bcrypt · JWT + token_version</text>
  <text class="s" x="436" y="270">owner-scoped queries · rate limits</text>
  <rect class="box" x="640" y="206" width="200" height="74" rx="12"/>
  <text class="t" x="656" y="234">Write path</text>
  <text class="s" x="656" y="254">chunk → embed → store</text>
  <text class="s" x="656" y="270">file / URL importers (SSRF-safe)</text>
  <rect class="box" x="420" y="296" width="420" height="150" rx="12"/>
  <text class="t" x="436" y="324">Chat orchestrator</text>
  <text class="s" x="436" y="348">1 understand → 2 retrieve → 3 persona → 4 assemble</text>
  <text class="s" x="436" y="368">5 prompt → 6 generate → 7 validate → 8 persist</text>
  <rect x="436" y="384" width="190" height="46" rx="10" fill="#F7F1E3" stroke="#E6D9BF"/>
  <text class="s" x="448" y="404">AIService</text>
  <text class="s" x="448" y="421">Anthropic · OpenAI · Demo</text>
  <rect x="636" y="384" width="190" height="46" rx="10" fill="#F7F1E3" stroke="#E6D9BF"/>
  <text class="s" x="648" y="404">Embedder</text>
  <text class="s" x="648" y="421">local hashing · OpenAI</text>
  <rect class="box" x="420" y="462" width="420" height="96" rx="12"/>
  <text class="t" x="436" y="490">SQLAlchemy 2 + Alembic</text>
  <text class="s" x="436" y="512">EmbeddingVector type: vector(384) on PostgreSQL,</text>
  <text class="s" x="436" y="530">JSON + Python cosine on SQLite (tests / quick local runs)</text>

  <!-- data + providers -->
  <rect class="zone" x="920" y="80" width="240" height="300" rx="16"/>
  <text class="z" x="940" y="112">PostgreSQL</text>
  <rect class="dark" x="940" y="132" width="200" height="58" rx="12"/>
  <text class="w" x="956" y="158">pgvector (HNSW)</text>
  <text class="ws" x="956" y="178">cosine distance &lt;=&gt;</text>
  <text class="s" x="940" y="216">users · mentor_profiles</text>
  <text class="s" x="940" y="236">personality_profiles · user_settings</text>
  <text class="s" x="940" y="256">knowledge_documents · _chunks</text>
  <text class="s" x="940" y="276">experience_memories · tags (+ links)</text>
  <text class="s" x="940" y="296">conversations · messages</text>
  <text class="s" x="940" y="316">message_sources</text><text class="s" x="940" y="334">conversation_memories</text>
  <text class="s" x="940" y="362">Docker volume / Render DB</text>

  <rect class="zone" x="920" y="400" width="240" height="180" rx="16"/>
  <text class="z" x="940" y="432">AI providers</text>
  <text class="s" x="940" y="460">Anthropic Claude (official SDK)</text>
  <text class="s" x="940" y="480">default model: claude-opus-5</text>
  <text class="s" x="940" y="500">OpenAI / compatible gateway</text>
  <text class="s" x="940" y="520">OpenAI embeddings (384-d)</text>
  <text class="s" x="940" y="548">Optional — demo mode needs none</text>

  <!-- arrows -->
  <path class="l" d="M340 253 H418"/>
  <text class="lab" x="350" y="244">HTTPS /api</text>
  <path class="l" d="M840 510 C 880 510, 880 260, 918 240"/>
  <text class="lab" x="862" y="400" transform="rotate(-76 862 400)">SQL (user_id filtered)</text>
  <path class="l" d="M826 407 C 880 407, 880 480, 918 480"/>
</svg>
