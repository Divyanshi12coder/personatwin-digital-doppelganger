<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9ED"/>
      <stop offset="1" stop-color="#F7F1E3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#F8E8B0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8E8B0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="1280" height="32" patternUnits="userSpaceOnUse">
      <rect width="1280" height="31" fill="none"/>
      <rect y="31" width="1280" height="1" fill="#806B5A" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4226"/>
      <stop offset="1" stop-color="#2E1B10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E8B0"/>
      <stop offset="0.5" stop-color="#E7B84B"/>
      <stop offset="1" stop-color="#B3860F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#lines)"/>
  <rect x="70" y="0" width="2" height="360" fill="#D4A017" fill-opacity="0.35"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- logo -->
  <rect x="110" y="70" width="64" height="64" rx="16" fill="#4A2C1A"/>
  <path d="M128 116c8-2 14-8 18-16l6-12 4 2-6 12c-4 9-11 15-20 17z" fill="#E7B84B"/>
  <circle cx="154" cy="90" r="3" fill="#FFF9ED"/>
  <path d="M124 120h22" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
  <text x="190" y="118" font-size="44" font-weight="700" fill="#4A2C1A">Persona<tspan fill="#D4A017">Twin</tspan></text>

  <text x="110" y="196" font-size="34" font-weight="600" fill="#4A2C1A">Meet the version of you that</text>
  <text x="110" y="238" font-size="34" font-weight="600" fill="#4A2C1A">never forgets what you've learned.</text>
  <path d="M110 250c60-8 180-10 260-2" stroke="#D4A017" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <text x="110" y="292" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#806B5A">Digital doppelganger mentor · persona memory · episodic memory · RAG on pgvector</text>

  <!-- notebook -->
  <g transform="translate(830 64) rotate(-6)">
    <rect x="0" y="6" width="190" height="236" rx="9" fill="#6B4226"/>
    <rect x="8" y="0" width="186" height="234" rx="7" fill="#FFF9ED" stroke="#E6D9BF"/>
    <path d="M38 0v234" stroke="#D4A017" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#806B5A" stroke-opacity="0.2">
      <path d="M14 44h176M14 66h176M14 88h176M14 110h176M14 132h176M14 154h176M14 176h176M14 198h176"/>
    </g>
    <path d="M50 40c10-6 18 6 28 0s18-6 26 0 16 4 24-2M50 62c14-4 22 4 34 0s20-4 30 2M50 84c8-4 16 4 26 0" stroke="#4A2C1A" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
    <g fill="#F7F1E3" stroke="#806B5A" stroke-opacity="0.4">
      <circle cx="8" cy="24" r="5"/><circle cx="8" cy="52" r="5"/><circle cx="8" cy="80" r="5"/><circle cx="8" cy="108" r="5"/><circle cx="8" cy="136" r="5"/><circle cx="8" cy="164" r="5"/><circle cx="8" cy="192" r="5"/>
    </g>
  </g>
  <!-- pen -->
  <g transform="translate(860 270) rotate(-16)">
    <path d="M52 8h126c8 0 14 5 14 12s-6 12-14 12H52z" fill="url(#pen)"/>
    <rect x="144" y="8" width="8" height="24" fill="url(#gold)"/>
    <path d="M52 8 28 14l-4 6 4 6 24 6z" fill="#2E1B10"/>
    <path d="M28 14 0 20l28 6z" fill="url(#gold)"/>
  </g>
  <!-- network -->
  <g stroke="#6B4226" stroke-opacity="0.4" stroke-dasharray="4 5" stroke-width="1.5">
    <path d="M1080 110 1150 160M1150 160 1200 100M1150 160 1170 240M1080 110 1040 180"/>
  </g>
  <g stroke="#6B4226" stroke-width="2">
    <circle cx="1080" cy="110" r="10" fill="#FFF9ED"/>
    <circle cx="1150" cy="160" r="15" fill="#4A2C1A"/>
    <circle cx="1200" cy="100" r="9" fill="#FFF9ED"/>
    <circle cx="1170" cy="240" r="10" fill="#FFF9ED"/>
  </g>
  <circle cx="1150" cy="160" r="5" fill="#E7B84B"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B4226" text-anchor="middle">
    <text x="1080" y="114">K</text><text x="1200" y="104">E</text><text x="1170" y="244">V</text>
  </g>
  <!-- sticky note -->
  <g transform="translate(1040 262) rotate(4)">
    <rect width="150" height="64" fill="#F8E8B0"/>
    <text x="14" y="28" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#4A2C1A">Mistakes are data,</text>
    <text x="14" y="50" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#4A2C1A">not verdicts.</text>
  </g>
</svg>
