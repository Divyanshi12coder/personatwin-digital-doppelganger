<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6B4226"/>
    </marker>
    <style>
      .zone{fill:#F7F1E3;stroke:#E6D9BF;stroke-width:1.5}
      .box{fill:#fff;stroke:#E6D9BF;stroke-width:1.5}
      .z{font-family:Georgia,serif;font-size:18px;font-weight:700;fill:#6B4226}
      .t{font-size:14.5px;font-weight:700;fill:#4A2C1A}
      .s{font-size:12px;fill:#806B5A}
      .l{stroke:#6B4226;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lab{font-size:11.5px;fill:#6B4226}
    </style>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#FFF9ED"/>
  <text x="40" y="46" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#4A2C1A">Deployment targets</text>

  <!-- local -->
  <rect class="zone" x="40" y="72" width="520" height="300" rx="16"/>
  <text class="z" x="60" y="104">Local — docker compose up</text>
  <rect class="box" x="60" y="124" width="150" height="110" rx="12"/>
  <text class="t" x="74" y="150">frontend</text>
  <text class="s" x="74" y="172">nginx :8080</text>
  <text class="s" x="74" y="190">SPA + /api proxy</text>
  <text class="s" x="74" y="208">healthz check</text>
  <rect class="box" x="230" y="124" width="150" height="110" rx="12"/>
  <text class="t" x="244" y="150">backend</text>
  <text class="s" x="244" y="172">uvicorn :8000</text>
  <text class="s" x="244" y="190">alembic upgrade</text>
  <text class="s" x="244" y="208">on start · /api/health</text>
  <rect x="400" y="124" width="140" height="110" rx="12" fill="#4A2C1A"/>
  <text x="414" y="150" font-size="14.5" font-weight="700" fill="#FFF9ED">postgres</text>
  <text x="414" y="172" font-size="12" fill="#F8E8B0">pgvector/pgvector</text>
  <text x="414" y="190" font-size="12" fill="#F8E8B0">:pg16 · pg_isready</text>
  <text x="414" y="208" font-size="12" fill="#F8E8B0">volume: pgdata</text>
  <path class="l" d="M210 179 H228"/>
  <path class="l" d="M380 179 H398"/>
  <text class="s" x="60" y="268">Startup order is enforced with health checks:</text>
  <text class="s" x="60" y="288">postgres healthy → backend migrates &amp; becomes healthy → frontend starts.</text>
  <text class="s" x="60" y="316">All three share the private “internal” network; only :8080 and :8000 are published.</text>
  <text class="s" x="60" y="336">Secrets come from .env (never committed) — see .env.example.</text>

  <!-- cloud -->
  <rect class="zone" x="600" y="72" width="560" height="300" rx="16"/>
  <text class="z" x="620" y="104">Cloud — Vercel + Render</text>
  <rect class="box" x="620" y="124" width="160" height="110" rx="12"/>
  <text class="t" x="634" y="150">Vercel</text>
  <text class="s" x="634" y="172">static Vite build</text>
  <text class="s" x="634" y="190">SPA rewrites</text>
  <text class="s" x="634" y="208">VITE_API_URL</text>
  <rect class="box" x="810" y="124" width="160" height="110" rx="12"/>
  <text class="t" x="824" y="150">Render web</text>
  <text class="s" x="824" y="172">Docker (backend/)</text>
  <text class="s" x="824" y="190">render.yaml blueprint</text>
  <text class="s" x="824" y="208">healthCheckPath</text>
  <rect x="1000" y="124" width="140" height="110" rx="12" fill="#4A2C1A"/>
  <text x="1014" y="150" font-size="14.5" font-weight="700" fill="#FFF9ED">Render PG</text>
  <text x="1014" y="172" font-size="12" fill="#F8E8B0">PostgreSQL 16</text>
  <text x="1014" y="190" font-size="12" fill="#F8E8B0">CREATE EXTENSION</text>
  <text x="1014" y="208" font-size="12" fill="#F8E8B0">vector (migration)</text>
  <path class="l" d="M780 179 H808"/>
  <text class="lab" x="782" y="170">CORS</text>
  <path class="l" d="M970 179 H998"/>
  <text class="s" x="620" y="268">Render env: DATABASE_URL (from DB), JWT_SECRET (generated),</text>
  <text class="s" x="620" y="288">CORS_ORIGINS = Vercel origin, AI_PROVIDER / AI_API_KEY (dashboard only).</text>
  <text class="s" x="620" y="316">postgres:// URLs are normalised to the psycopg driver automatically.</text>
  <text class="s" x="620" y="336">ENVIRONMENT=production refuses to start with a weak JWT secret.</text>
</svg>
