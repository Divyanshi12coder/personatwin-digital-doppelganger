# Render Blueprint: PersonaTwin FastAPI backend.
# PostgreSQL is hosted in the existing finora-db Render instance.
# The personatwin database was created separately inside that instance.
# Frontend is deployed separately on Vercel.

services:
  - type: web
    name: personatwin-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: FORWARDED_ALLOW_IPS
        value: "*"

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: AI_PROVIDER
        value: anthropic

      - key: AI_API_KEY
        sync: false

      - key: AI_MODEL
        value: claude-opus-5

      - key: EMBEDDING_PROVIDER
        value: local