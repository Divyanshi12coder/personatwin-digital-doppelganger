# Render Blueprint: managed PostgreSQL + the FastAPI backend (Docker).
# The frontend is deployed separately on Vercel (see docs/deployment.md).
databases:
  - name: personatwin-db
    plan: free
    databaseName: personatwin
    user: personatwin
    postgresMajorVersion: "16"

services:
  - type: web
    name: personatwin-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: "*" # Render's proxy is the only way to reach the service
      - key: DATABASE_URL
        fromDatabase:
          name: personatwin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # your Vercel origin, e.g. https://personatwin.vercel.app
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_API_KEY
        sync: false # set in the Render dashboard; never committed
      - key: AI_MODEL
        value: claude-opus-5
      - key: EMBEDDING_PROVIDER
        value: local
